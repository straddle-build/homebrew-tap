name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check repository hygiene
        run: git diff --check

      - name: Validate Homebrew tap
        shell: bash
        run: |
          test -f README.md
          test -f .github/CODEOWNERS

          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find Formula Casks -type f -name '*.rb' -print0 2>/dev/null || true)

          for file in "${files[@]}"; do
            ruby -c "$file"
          done

          if ((${#files[@]})); then
            # brew audit accepts names, not paths. Tap this checkout (the
            # candidate commit) and audit its fully qualified names.
            tap=straddle-build/tap
            brew tap "$tap" "$GITHUB_WORKSPACE"
            test "$(git -C "$(brew --repo "$tap")" rev-parse HEAD)" = "$(git rev-parse HEAD)"

            formulae=()
            casks=()
            for file in "${files[@]}"; do
              case "$file" in
                Formula/*) formulae+=("$tap/$(basename "$file" .rb)") ;;
                Casks/*) casks+=("$tap/$(basename "$file" .rb)") ;;
              esac
            done
            if ((${#formulae[@]})); then
              brew audit --strict --online --formula "${formulae[@]}"
            fi
            if ((${#casks[@]})); then
              brew audit --strict --online --cask "${casks[@]}"
            fi
          fi
